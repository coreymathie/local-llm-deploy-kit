apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lldk.fullname" . }}-test-connection
  labels:
    {{- include "lldk.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: health
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command: ["python", "-c"]
      args:
        - |
          import json, sys, urllib.request
          r = json.load(urllib.request.urlopen("http://{{ include "lldk.fullname" . }}:{{ .Values.service.port }}/health", timeout=10))
          print(r); sys.exit(0 if r.get("status") == "ok" else 1)
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
