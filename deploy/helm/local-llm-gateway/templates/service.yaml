apiVersion: v1
kind: Service
metadata:
  name: {{ include "lldk.fullname" . }}
  labels:
    {{- include "lldk.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "lldk.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
