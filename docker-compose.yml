services:
  ollama:
    image: ollama/ollama:latest
    container_name: lldk-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # Uncomment for NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  gateway:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY gateway /app/gateway
        COPY admin-ui /app/admin-ui
        EXPOSE 8080
        CMD ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8080"]
    container_name: lldk-gateway
    restart: unless-stopped
    depends_on: [ollama]
    environment:
      # Default: Ollama. For vLLM (or any OpenAI-compatible server) see the vllm service below.
      BACKEND: ${BACKEND:-ollama}
      OLLAMA_HOST: http://ollama:11434
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-http://vllm:8000/v1}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      GATEWAY_DEFAULT_MODEL: ${GATEWAY_DEFAULT_MODEL:-llama3.1:8b}
      GATEWAY_EMBED_MODEL: ${GATEWAY_EMBED_MODEL:-nomic-embed-text}
      GATEWAY_DB_PATH: /data/gateway.db
      GATEWAY_LOG_DIR: /data/logs
    volumes:
      - gateway-data:/data
    ports:
      - "127.0.0.1:8080:8080"

  # Optional GPU backend. Not started by a plain `docker compose up`. To use it:
  #   BACKEND=openai_compatible GATEWAY_DEFAULT_MODEL=Qwen/Qwen2.5-7B-Instruct \
  #   VLLM_MODEL=Qwen/Qwen2.5-7B-Instruct docker compose --profile vllm up -d
  # Needs an NVIDIA GPU with the NVIDIA Container Toolkit. vLLM serves one model per
  # process, so document Q&A also needs an embedding endpoint; see
  # docs/adr/0001-inference-backend.md for the options.
  vllm:
    image: vllm/vllm-openai:latest
    container_name: lldk-vllm
    profiles: ["vllm"]
    restart: unless-stopped
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}", "--max-model-len", "${VLLM_MAX_MODEL_LEN:-8192}"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}          # only for gated models
      VLLM_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
    volumes:
      - vllm-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
  gateway-data:
  vllm-cache:
