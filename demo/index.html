<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Private LLM Platform</title>
<meta name="description" content="Private LLM Platform console: chat with cited answers over permission-aware documents, document ACLs, API keys and SSO roles, a hash-chained audit log, model pinning and RAG evals. Runs the gateway's real Python code in your browser (demo mode) or against a running gateway (live mode)." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<script>
// Files the demo mode loads into Pyodide (paths relative to this page). Live mode loads none of them.
const GATEWAY_FILES = ["config.py", "models.py", "store.py", "identity.py", "crypto.py", "auth.py", "audit.py", "redact.py", "logging_setup.py", "telemetry.py", "backends.py", "retrieval.py", "rag.py", "supply_chain.py", "console.py"];
const DEMO_FILES = ["shims.py", "engine.py"];
const SCRIPT_FILES = ["mlbom.py", "rag_eval.py"];
const SAMPLES = ["sample-remote-work-policy.md", "sample-data-retention-policy.md", "sample-travel-expense-policy.md"];
const RESTRICTED_SAMPLES = [
  {"file": "restricted-hr-compensation-bands.md", "acl": ["group:hr"]},
  {"file": "restricted-payments-oncall-runbook.md", "acl": ["group:engineering"]}
];
window.CONSOLE_MANIFEST = { GATEWAY_FILES, DEMO_FILES, SCRIPT_FILES, SAMPLES, RESTRICTED_SAMPLES };
</script>
</head>
<body data-ready="">
<a class="sr-only" href="#view">Skip to content</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <span>Private LLM Platform<small id="brandSub">Console</small></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="footMode">Starting…</div>
      <div style="margin-top:6px"><a href="https://github.com/coreymathie/private-llm-platform">View the repo</a> · <a href="https://github.com/coreymathie/private-llm-platform/tree/main/docs">Docs</a></div>
      <div style="margin-top:6px">MIT · Corey Mathie</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn ghost" id="menuBtn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="title" id="pageTitle">Overview</div>
      <div class="spacer"></div>
      <span class="badge" id="modeBadge"><span class="dot"></span><span id="modeText">Starting</span></span>
      <button class="ghost sm hide-sm" id="tourBtn" title="Restart the guided tour">Tour</button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Details" aria-hidden="true">
  <div class="dh"><h2 id="drawerTitle">Details</h2><button class="ghost" id="drawerClose" aria-label="Close details">Close</button></div>
  <div class="db" id="drawerBody"></div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
<div class="tour-ring" id="tourRing"></div>
<div class="tour-card" id="tourCard" role="dialog" aria-label="Guided tour"></div>
<div class="tooltip" id="tooltip" role="tooltip"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="boot" id="boot">
  <div class="box card">
    <h1 id="bootTitle">Starting the console…</h1>
    <p class="muted" id="bootNote">Detecting whether a gateway is serving this page.</p>
    <ol id="bootSteps"></ol>
    <div class="modules" id="bootModules"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
