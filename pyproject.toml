[project]
name = "local-llm-deploy-kit"
version = "0.6.0"
description = "Private LLM gateway: Ollama or vLLM behind an OpenAI-compatible API with API keys and OIDC roles, permission-aware hybrid document Q&A, encryption at rest, model pinning, a tamper-evident audit log, Prometheus metrics, a Helm chart and an admin UI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Corey Mathie" }]
keywords = ["llm", "ollama", "vllm", "on-prem", "fastapi", "openai-compatible", "audit-log", "rag", "prometheus", "opentelemetry", "compliance", "oidc", "helm", "cyclonedx"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
