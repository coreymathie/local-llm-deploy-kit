name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5  # tests/helm_render (chart render harness)
        with:
          go-version: stable
          cache: false
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff opentelemetry-sdk "cyclonedx-python-lib[json-validation]"
      - run: ruff check gateway tests scripts demo
      - run: ruff format --check gateway tests scripts demo
      - run: pytest -q
      - run: python scripts/rag_eval.py --check
      - run: python scripts/sample_library.py --check
      - run: python scripts/generate_sample_company.py --check
      - run: shellcheck scripts/*.sh
      - run: helm lint deploy/helm/local-llm-gateway --strict
      - run: helm template gw deploy/helm/local-llm-gateway -f deploy/helm/local-llm-gateway/values-vllm-gpu.yaml > /dev/null
      - run: helm template gw deploy/helm/local-llm-gateway -f deploy/helm/local-llm-gateway/values-airgapped.yaml > /dev/null
      - run: bash scripts/airgap_bundle.sh --dry-run --ollama-model llama3.1:8b

  console-smoke:
    # Headless browser checks of the console (scripts/demo_smoke.py). Live mode needs no external network:
    # it starts the gateway and the simulated mock backend locally. Demo mode loads Pyodide from
    # cdn.jsdelivr.net, so a CDN hiccup doesn't fail the build.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Live mode (gateway + simulated backend)
        run: python scripts/demo_smoke.py --live --skip-demo --screenshots smoke-screenshots
      - name: Demo mode (Pyodide from the CDN)
        continue-on-error: true
        run: python scripts/demo_smoke.py --screenshots smoke-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: smoke-screenshots
          if-no-files-found: ignore
